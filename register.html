
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2027 | Registration</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">TECH<span>FEST</span> 2027</div>
    <nav>
        <a href="index.html">Home</a>
        <a href="events.html">Events</a>
        <a href="schedule.html">Schedule</a>
        <a href="register.html" class="active">Register</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main class="container">
    <h1 class="section-title">Event <span>Registration</span></h1>

    <form action="/.registers">

        <h2>Personal Information</h2>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name"
               placeholder="Enter your full name" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email"
               placeholder="Enter your email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone"
               placeholder="Enter your phone number"
               pattern="[0-9]{10}" required>

        <label for="department">Department</label>
        <select id="department" name="department" required>
            <option value="">Select Department</option>
            <option>Computer Science</option>
            <option>Information Technology</option>
            <option>Other</option>
        </select>

        <label for="year">Year of Study</label>
        <select id="year" name="year" required>
            <option value="">Select Year</option>
            <option>First Year</option>
            <option>Second Year</option>
            <option>Third Year</option>
            <option>Fourth Year</option>
        </select>

        <label>Gender</label>
        <div class="option">
            <input type="radio" name="gender" value="Male" required> Male
        </div>
        <div class="option">
            <input type="radio" name="gender" value="Female"> Female
        </div>
        <div class="option">
            <input type="radio" name="gender" value="Other"> Other
        </div>

        <label>Choose Your Events</label>

        <div class="option">
            <input type="checkbox" name="events" value="Coding"> Coding
        </div>

        <div class="option">
            <input type="checkbox" name="events" value="Robo Race"> Robo Race
        </div>

        <div class="option">
            <input type="checkbox" name="events" value="Gaming"> Gaming
        </div>

        <div class="option">
            <input type="checkbox" name="events" value="Poster Design"> Poster Designing
        </div>

        <div class="option">
            <input type="checkbox" name="events" value="Singing"> Singing
        </div>

        <label for="message">Additional Information</label>
        <textarea id="message" name="message" rows="4"
                  placeholder="Tell us about yourself or your interests..."></textarea>

        <div style="margin-top:20px;">
            <input type="checkbox" id="terms" required>
            <label for="terms" style="display:inline;">
                I agree to the event terms and conditions.
            </label>
        </div>

        <button type="submit" class="btn">Submit Registration</button>
        <button type="reset" class="btn">Reset Form</button>

    </form>
</main>

<footer>
    <p>© 2027 TechFest | Quad AI School Of Technology</p>
</footer>

</body>
</html>
